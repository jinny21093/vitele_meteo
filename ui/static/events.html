<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Погода — События</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<script src="/static/app.js" defer></script>
<script src="/static/page-events.js" defer></script>
</head>
<body>
<header class="topbar">
  <nav class="nav" aria-label="Разделы"><a href="/">Сейчас</a><a href="/day">Сутки</a><a href="/month">Месяц</a><a href="/events" class="active">События</a><a href="/forecast">Прогноз</a><a href="/settings" class="nav-minor">Настройки</a></nav>
  <div class="indicators">
    <span class="dot-wrap" title="Свежесть данных коллектора">
      <span class="dot" id="fresh-dot"></span><span id="fresh-text" class="dot-text">—</span>
    </span>
    <span class="dot-wrap" title="Батарея датчиков">
      <span class="dot" id="batt-dot"></span><span id="batt-text" class="dot-text">—</span>
    </span>
    <span id="ui-version" class="muted"></span>
    <button id="theme-toggle" class="btn-icon" type="button" title="Светлая/тёмная тема">&#9680;</button>
  </div>
</header>

<div id="banner" class="banner hidden" role="alert"></div>

<main class="charts-page">
  <section class="chart-card">
    <h2>Период и фильтры</h2>
    <div class="controls" role="group" aria-label="Окно событий">
      <span class="muted">Окно:</span>
      <button class="seg" data-days="1" type="button">1 день</button>
      <button class="seg" data-days="7" type="button">7 дней</button>
      <button class="seg" data-days="30" type="button">30 дней</button>
      <button class="seg" data-days="90" type="button">90 дней</button>
    </div>
    <div class="filters">
      <div class="chip-row" id="type-chips" role="group" aria-label="Фильтр по типу"></div>
      <div class="chip-row" id="sev-chips" role="group" aria-label="Фильтр по severity"></div>
    </div>
    <p class="muted">Пустой выбор — без фильтра. Клик по событию — карточка с context.</p>
  </section>
  <section class="chart-card">
    <h2>Таймлайн</h2>
    <div id="timeline"><span class="muted">загрузка&hellip;</span></div>
  </section>
</main>

<footer class="foot">
  <button id="refresh" class="btn" type="button">Обновить</button>
  <span id="last-update" class="muted"></span>
</footer>
</body>
</html>
