<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Погода — Настройки</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <nav class="nav" aria-label="Разделы"><a href="/">Сейчас</a><a href="/day">Сутки</a><a href="/month">Месяц</a><a href="/events">События</a><a href="/forecast">Прогноз</a><a href="/settings" class="nav-minor active">Настройки</a></nav>
  <div class="indicators">

      <span class="dot" id="batt-dot"></span><span id="batt-text" class="dot-text">—</span>

<div id="banner" class="banner hidden" role="alert"></div>

<main class="placeholder-wrap">
  <section class="card placeholder">
    <h2>Настройки</h2>
    <p>Экран появится в юните U6 (ТЗ weather-ui-spec.md §11).</p>
    <p class="muted">Сейчас реализованы U0 (скелет, auth, health) и U1 («Сейчас»).</p>
  </section>
</main>

<footer class="foot"><span id="last-update" class="muted"></span></footer>
